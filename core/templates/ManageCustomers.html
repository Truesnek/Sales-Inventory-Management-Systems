<!DOCTYPE html>
<html>
<head>
    <title>Manage Customers</title>
</head>
<body>
    <nav style="background:#333; padding:10px;">
        <a href="{% url 'manage-products' %}" style="color:white;">Products</a>
        <a href="{% url 'manage-inventory' %}" style="color:white;">Inventory</a>
        <a href="{% url 'manage-suppliers' %}" style="color:white;">Suppliers</a>
        <a href="{% url 'create-purchase-order' %}" style="color:white;">Orders</a>
        <a href="{% url 'generate-report' %}" style="color:white;">Reports</a>
    </nav>
    <hr>

    <h2>Customers</h2>

    {% if customers %}
    <table border="1">
        <tr>
            <th>ID</th><th>Name</th><th>Contact Info</th>
        </tr>
        {% for c in customers %}
        <tr>
            <td>{{ c.customer_id }}</td>
            <td>{{ c.customer_name }}</td>
            <td>{{ c.contact_info }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No customers found.</p>
    {% endif %}
</body>
</html>
