<!DOCTYPE html>
<html>
<head>
    <title>Manage Branch Inventory</title>
</head>
<body>
    <nav style="background:#333; padding:10px;">
        <a href="{% url 'manage-products' %}" style="color:white; margin-right:15px;">Manage Products</a>
        <a href="{% url 'manage-inventory' %}" style="color:white; margin-right:15px;">Manage Branch Inventory</a>
        <a href="{% url 'manage-suppliers' %}" style="color:white; margin-right:15px;">Manage Suppliers</a>
        <a href="{% url 'create-purchase-order' %}" style="color:white; margin-right:15px;">Create Purchase Order</a>
        <a href="{% url 'generate-reports' %}" style="color:white; margin-right:15px;">Generate Report</a>
    </nav>
    <hr>

    <h2>View Product</h2>
    <!-- View product table -->
     <button onclick="loadProducts()">Refresh Products</button><br><br>

    <table border="1" id="productsTable">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Product Description</th>
                <th>Unit Price</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <hr>

    <h2>View Branch Inventory</h2>
    <!-- Inventory table -->
     <button onclick="loadInventory()">Refresh Products</button><br><br>

    <table border="1" id="productsTable">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Product Description</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <hr>

    <h2>Monitor Stock Levels</h2>
    <!-- Stock monitoring -->
    <hr>


    <script>
        async function loadProducts() {
            const response = await fetch("/api/products/view/");
            const products = await response.json();

            const tbody = document.querySelector("#productsTable tbody");
            tbody.innerHTML = "";

            products.forEach(product => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${product.product_id}</td>
                    <td>${product.product_name || ""}</td>
                    <td>${product.product_description || ""}</td>
                    <td>${product.unit_price || ""}</td>
                `;
                tbody.appendChild(row);
            });
        }
        async function loadInventory() {
            const response = await fetch("/api/products/view/");
            const products = await response.json();

            const tbody = document.querySelector("#productsTable tbody");
            tbody.innerHTML = "";

            products.forEach(product => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${product.product_id}</td>
                    <td>${product.product_name || ""}</td>
                    <td>${product.num_product || ""}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
