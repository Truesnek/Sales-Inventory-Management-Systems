<!DOCTYPE html>
<html>
<head>
    <title>View Branch Inventory</title>
</head>
<body>
    <nav style="background:#333; padding:10px;">
        <a href="{% url 'branch_inventory' %}" style="color:white; margin-right:15px;">View Branch Inventory</a>
        <a href="{% url 'manage_customers' %}" style="color:white; margin-right:15px;">Manage Customers</a>
        <a href="{% url 'record_purchase' %}" style="color:white; margin-right:15px;">Record Customer Purchase</a>
        <a href="{% url 'transaction_history' %}" style="color:white; margin-right:15px;">View Transaction History</a>
    </nav>
    <hr>

    <h2>Branch Inventory Table</h2>

    <button onclick="loadBranchInventory()">Refresh Branch Inventory</button><br><br>
    <table border="1" id="branchInventoryTable">
        <thead>
            <tr>
                <th>Branch ID</th>
                <th>Branch Address</th>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadBranchInventory() {
            const response = await fetch("/api/inventory/view/");
            const inventory = await response.json();
            const tbody = document.querySelector("#branchInventoryTable tbody");
            tbody.innerHTML = "";
            inventory.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${item.branch_id}</td>
                    <td>${item.address || ""}</td>
                    <td>${item.product_id}</td>
                    <td>${item.product_name || ""}</td>
                    <td>${item.quantity}</td>
                `;
                tbody.appendChild(row);
            });
        }
        loadBranchInventory();
    </script>
</body>
</html>
