<!DOCTYPE html>
<html>
<head>
    <title>Manage Customers</title>
</head>
<body>
    <nav style="background:#333; padding:10px;">
        <a href="{% url 'branch_inventory' %}" style="color:white; margin-right:15px;">View Branch Inventory</a>
        <a href="{% url 'manage_customers' %}" style="color:white; margin-right:15px;">Manage Customers</a>
        <a href="{% url 'record_purchase' %}" style="color:white; margin-right:15px;">Record Customer Purchase</a>
        <a href="{% url 'transaction_history' %}" style="color:white; margin-right:15px;">View Transaction History</a>
    </nav>
    <hr>

    <h2>Add Customer</h2>
    <form id="addCustomerForm">
        <label>Customer Name:</label><br>
        <input type="text" id="add_customer_name" required><br><br>
        <label>Contact Info:</label><br>
        <input type="text" id="add_contact_info"><br><br>
        <button type="submit">Add Customer</button>
    </form>
    <p id="addMessage"></p>

    <hr>

    <h2>Update Customer Information</h2>
    <form id="updateCustomerForm">
        <label>Customer ID:</label><br>
        <input type="number" id="update_customer_id" required><br><br>
        <label>Customer Name:</label><br>
        <input type="text" id="update_customer_name"><br><br>
        <label>Contact Info:</label><br>
        <input type="text" id="update_contact_info"><br><br>
        <button type="submit">Update Customer</button>
    </form>
    <p id="updateMessage"></p>

    <script>
        document.getElementById("addCustomerForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const data = {
                customer_name: document.getElementById("add_customer_name").value,
                contact_info: document.getElementById("add_contact_info").value
            };
            const response = await fetch("/api/customers/add/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                document.getElementById("addMessage").innerText = "Customer added successfully.";
                document.getElementById("addCustomerForm").reset();
            } else {
                document.getElementById("addMessage").innerText = "Failed to add customer.";
            }
        });

        document.getElementById("updateCustomerForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const customerId = document.getElementById("update_customer_id").value;
            const data = {
                customer_name: document.getElementById("update_customer_name").value,
                contact_info: document.getElementById("update_contact_info").value
            };
            const response = await fetch(`/api/customers/update/${customerId}/`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                document.getElementById("updateMessage").innerText = "Customer updated successfully.";
                document.getElementById("updateCustomerForm").reset();
            } else {
                document.getElementById("updateMessage").innerText = "Failed to update customer.";
            }
        });
        
    </script>
</body>
</html>
