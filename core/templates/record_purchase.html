<!DOCTYPE html>
<html>
<head>
    <title>Record Customer Purchase</title>
</head>
<body>
    <nav style="background:#333; padding:10px;">
        <a href="{% url 'branch_inventory' %}" style="color:white; margin-right:15px;">View Branch Inventory</a>
        <a href="{% url 'manage_customers' %}" style="color:white; margin-right:15px;">Manage Customers</a>
        <a href="{% url 'record_purchase' %}" style="color:white; margin-right:15px;">Record Customer Purchase</a>
        <a href="{% url 'transaction_history' %}" style="color:white; margin-right:15px;">View Transaction History</a>
    </nav>
    <hr>
    <h2>Process Transaction</h2>
    <form id="purchaseForm">
        <label>Transaction Status:</label><br>
        <input type="text" id="transaction_status"><br><br>

        <label>Total Amount:</label><br>
        <input type="number" id="total_amount" step="0.01"><br><br>

        <label>Transaction Date:</label><br>
        <input type="date" id="transaction_date"><br><br>

        <label>Transaction Due Date:</label><br>
        <input type="date" id="transaction_due_date"><br><br>

        <label>Transaction Discount:</label><br>
        <input type="number" id="transaction_discount" step="0.01"><br><br>

        <button type="submit">Record Purchase</button>
    </form>
    <p id="purchaseMessage"></p>
    <hr>
    <h2>Generate Invoice</h2>

    <label>Transaction ID:</label><br>
    <input type="number" id="invoice_transaction_id"><br><br>

    <button onclick="generateInvoice()">Generate Invoice</button>

    <div id="invoiceBox"></div>

    <script>
        document.getElementById("purchaseForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const data = {
                transaction_status: document.getElementById("transaction_status").value,
                total_amount: document.getElementById("total_amount").value,
                transaction_date: document.getElementById("transaction_date").value,
                transaction_due_date: document.getElementById("transaction_due_date").value,
                transaction_discount: document.getElementById("transaction_discount").value,
                lines: []
            };

            const response = await fetch("/api/transactions/add/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById("purchaseMessage").innerText = "Purchase recorded successfully.";
                document.getElementById("purchaseForm").reset();
            } else {
                document.getElementById("purchaseMessage").innerText = "Failed to record purchase.";
            }
        });
       
        async function generateInvoice() {
            const transactionId = document.getElementById("invoice_transaction_id").value;

            const response = await fetch(`/api/invoice/${transactionId}/`);

            if (!response.ok) {
                document.getElementById("invoiceBox").innerHTML = "<p>Failed to generate invoice.</p>";
                return;
            }

            const invoice = await response.json();

            let html = `
                <h3>Invoice</h3>
                <p><strong>Transaction ID:</strong> ${invoice.transaction_id}</p>
                <p><strong>Transaction Date:</strong> ${invoice.transaction_date}</p>
                <p><strong>Due Date:</strong> ${invoice.transaction_due_date}</p>
                <p><strong>Status:</strong> ${invoice.transaction_status}</p>
                <p><strong>Discount:</strong> ${invoice.transaction_discount}</p>
                <p><strong>Total Amount:</strong> ${invoice.total_amount}</p>

                <h4>Purchased Products</h4>
                <table border="1">
                    <thead>
                        <tr>
                            <th>Line Number</th>
                            <th>Product ID</th>
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th>Unit Price</th>
                            <th>Line Total</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            invoice.lines.forEach(line => {
                html += `
                    <tr>
                        <td>${line.line_number}</td>
                        <td>${line.product_id}</td>
                        <td>${line.product_name}</td>
                        <td>${line.quantity}</td>
                        <td>${line.unit_price_at_sale}</td>
                        <td>${line.line_total}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById("invoiceBox").innerHTML = html;
        }
    </script>
</body>
</html>
